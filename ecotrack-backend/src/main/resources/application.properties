# Application name
spring.application.name=ecotrack-backend


# ===============================
# PostgreSQL Database Configuration
# ===============================

# Database URL — using your existing "ecotrack_db" database
spring.datasource.url=jdbc:postgresql://localhost:5432/ecotrack_db

# PostgreSQL username (default superuser)
spring.datasource.username=postgres

# TODO: put the password YOU set when installing PostgreSQL here
# (this is NOT "Sql_Password" — that was the old MySQL placeholder)
spring.datasource.password=Group_3intern

# PostgreSQL JDBC driver
spring.datasource.driver-class-name=org.postgresql.Driver


# ===============================
# Database Initialization
# ===============================

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=false


jwt.secret=your-super-secret-jwt-signing-key-change-this-later-2026


# ===============================
# JPA / Hibernate Configuration
# ===============================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# PostgreSQL dialect for Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

