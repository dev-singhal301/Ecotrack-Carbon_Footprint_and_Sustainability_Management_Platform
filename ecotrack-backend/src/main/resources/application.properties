# Application name
spring.application.name=ecotrack-backend


# ===============================
# PostgreSQL Database Configuration
# ===============================

# Database URL — using your existing "ecotrack_db" database
spring.datasource.url=jdbc:postgresql://localhost:5432/ecotrack_db

# PostgreSQL username (default superuser)
spring.datasource.username=postgres

# TODO: put the password YOU set when installing PostgreSQL here
# (this is NOT "Sql_Password" — that was the old MySQL placeholder)
spring.datasource.password=Group_3intern

# PostgreSQL JDBC driver
spring.datasource.driver-class-name=org.postgresql.Driver


# ===============================
# Database Initialization
# ===============================

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=false


jwt.secret=your-super-secret-jwt-signing-key-change-this-later-2026


# ===============================
# JPA / Hibernate Configuration
# ===============================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# PostgreSQL dialect for Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Google OAuth Login
google.client.id=1060715159333-01t5hgjdc1ke4ltra4e4edn3562vnjot.apps.googleusercontent.com

# ===============================
# Email (Password Reset)
# ===============================
# Use Mailtrap (sandbox.smtp.mailtrap.io) for local/team dev so nobody
# accidentally emails a real inbox while testing — swap for a real
# provider (SendGrid, SES, etc.) only in production config.
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME:1b642d52536476}
spring.mail.password=${MAIL_PASSWORD:179d15f8c92ba5}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Used to build the reset-password link embedded in the email
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:4200}

# ===============================
# AI Recommendation Engine (Gemini)
# ===============================
# Free-tier Gemini API — used by AiTipService, falls back to rule engine automatically on any failure.
gemini.api.key={GEMINI_API_KEY}
gemini.model=gemini-flash-latest