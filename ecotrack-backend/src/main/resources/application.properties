# Application name
spring.application.name=ecotrack-backend


# ===============================
# MySQL Database Configuration
# ===============================

# Database URL
spring.datasource.url=jdbc:mysql://localhost:3306/ecotrack_db

# MySQL username
spring.datasource.username=root

# Replace with your local MySQL password
spring.datasource.password=YOUR_MYSQL_PASSWORD_HERE

# MySQL JDBC driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



# ===============================
# Database Initialization
# ===============================

# Always execute schema.sql when the application starts
# Required because MySQL is not an embedded database
# This creates tables like users and roles from schema.sql
spring.sql.init.mode=always


# Makes sure schema.sql runs before Hibernate checks the database
# Without this, Hibernate validation may happen before tables exist
spring.jpa.defer-datasource-initialization=true



# ===============================
# JPA / Hibernate Configuration
# ===============================

# Validate Entity classes against existing database tables
# Hibernate will NOT create or modify tables
# Database structure is controlled by schema.sql
spring.jpa.hibernate.ddl-auto=validate


# Display SQL queries in the console during development
spring.jpa.show-sql=true


# MySQL database dialect for Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect