<div class="tracking-split-container">
  
  <section class="form-section">
    <div class="tracking-card">
      <h2 class="section-title">Log New Activity</h2>
      
      <form (submit)="onLogSubmit(); $event.preventDefault()">
        <div class="form-group">
          <label for="category">Activity Category</label>
          <select 
            id="category" 
            [(ngModel)]="entry.category" 
            name="category" 
            (change)="onCategoryChange()" 
            required>
            <option value="" disabled selected>Select category...</option>
            <option value="TRANSPORTATION">Transportation (km)</option>
            <option value="ELECTRICITY">Electricity (kWh)</option>
            <option value="FOOD">Food (kg)</option>
            <option value="WASTE">Waste (kg)</option>
            <option value="WATER">Water (litres)</option>
            <option value="FUEL">Fuel (litres)</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group half-width">
            <label for="amount">Amount</label>
            <input 
              type="number" 
              id="amount" 
              [(ngModel)]="entry.amount" 
              name="amount" 
              placeholder="e.g., 50" 
              min="0.01" 
              step="any"
              required>
          </div>

          <div class="form-group half-width">
            <label for="unit">Unit</label>
            <input 
              type="text" 
              id="unit" 
              [(ngModel)]="entry.unit" 
              name="unit" 
              readonly 
              class="readonly-input">
          </div>
        </div>

        <div class="form-group">
          <label for="activityDate">Activity Date</label>
          <input 
            type="date" 
            id="activityDate" 
            [(ngModel)]="entry.activityDate" 
            name="activityDate" 
            required>
        </div>

        <button type="submit" class="btn-log-activity">
          Record Activity
        </button>
      </form>
    </div>
  </section>

  <section class="history-section">
    <div class="tracking-card">
      <div class="history-header">
        <h2 class="section-title">Recent Logs</h2>
        
        <div class="filter-controls">
          <div class="filter-group">
            <label for="filterCategory">Category</label>
            <select id="filterCategory" [(ngModel)]="filters.category" (change)="loadHistory()" name="filterCategory">
              <option value="">All Categories</option>
              <option value="TRANSPORTATION">Transportation</option>
              <option value="ELECTRICITY">Electricity</option>
              <option value="FOOD">Food</option>
              <option value="WASTE">Waste</option>
              <option value="WATER">Water</option>
              <option value="FUEL">Fuel</option>
            </select>
          </div>
          
          <div class="filter-group">
            <label for="filterFrom">From Date</label>
            <input type="date" id="filterFrom" [(ngModel)]="filters.from" (change)="loadHistory()" name="filterFrom">
          </div>
          
          <div class="filter-group">
            <label for="filterTo">To Date</label>
            <input type="date" id="filterTo" [(ngModel)]="filters.to" (change)="loadHistory()" name="filterTo">
          </div>
          
          <div class="filter-group button-group">
            <label class="hidden-label">&nbsp;</label>
            <button class="btn-clear" type="button" (click)="clearFilters()">Reset</button>
          </div>
        </div>
      </div>

      <div class="table-scroll-container">
        <table class="history-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Category</th>
              <th>Amount</th>
              <th>Calculated Emission</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of historyLogs">
              <td>{{ item.activityDate }}</td>
              <td>
                <span class="category-badge" [attr.data-category]="item.category">
                  {{ item.category }}
                </span>
              </td>
              <td>{{ item.amount }} {{ item.unit }}</td>
              <td class="emission-value">{{ item.carbonEmission | number:'1.2-2' }} kg CO₂</td>
              <td>
                <button class="btn-delete" (click)="onDeleteEntry(item.entryId)" title="Delete entry">
                  <i class="fa-regular fa-trash-can"></i>
                </button>
              </td>
            </tr>
            <tr *ngIf="historyLogs.length === 0">
              <td colspan="5" class="empty-state">No recorded logs match your search filters.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
  
</div>
