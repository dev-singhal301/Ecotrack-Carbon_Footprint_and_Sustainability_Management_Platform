<div class="reset-container">
  <h2>Almost there — set a password</h2>
  <p>You signed up with Google. Add a password now so you can also log in directly with your email next time.</p>

  <div *ngIf="errorMessage" class="alert alert-error">
    {{ errorMessage }}
  </div>

  <div *ngIf="successMessage" class="alert alert-success">
    {{ successMessage }}
  </div>

  <form (ngSubmit)="onSubmit()" *ngIf="!successMessage">
    <div class="form-group">
      <label for="newPassword">New Password</label>
      <input 
        type="password" 
        id="newPassword" 
        [(ngModel)]="newPassword" 
        name="newPassword" 
        required 
        placeholder="Enter new password"
      />
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input 
        type="password" 
        id="confirmPassword" 
        [(ngModel)]="confirmPassword" 
        name="confirmPassword" 
        required 
        placeholder="Confirm new password"
      />
    </div>

    <button type="submit" [disabled]="isLoading" class="btn-submit">
      {{ isLoading ? 'Saving...' : 'Set Password & Continue' }}
    </button>
  </form>
</div>
