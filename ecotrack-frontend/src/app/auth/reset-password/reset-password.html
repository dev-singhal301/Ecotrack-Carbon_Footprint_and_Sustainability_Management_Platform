<div class="reset-container" style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
  <h2>Set New Password</h2>
  <p>Please enter your new password below.</p>

  <div *ngIf="errorMessage" style="color: red; margin-bottom: 10px; padding: 8px; background-color: #f8d7da; border-radius: 4px;">
    {{ errorMessage }}
  </div>

  <div *ngIf="successMessage" style="color: green; margin-bottom: 10px; padding: 8px; background-color: #d4edda; border-radius: 4px;">
    {{ successMessage }}
  </div>

  <form (ngSubmit)="onSubmit()" *ngIf="!successMessage">
    <div style="margin-bottom: 15px;">
      <label for="newPassword" style="display: block; margin-bottom: 5px; font-weight: bold;">New Password</label>
      <input 
        type="password" 
        id="newPassword" 
        [(ngModel)]="newPassword" 
        name="newPassword" 
        required 
        style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;"
        placeholder="Enter new password"
      />
    </div>

    <div style="margin-bottom: 15px;">
      <label for="confirmPassword" style="display: block; margin-bottom: 5px; font-weight: bold;">Confirm Password</label>
      <input 
        type="password" 
        id="confirmPassword" 
        [(ngModel)]="confirmPassword" 
        name="confirmPassword" 
        required 
        style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;"
        placeholder="Confirm new password"
      />
    </div>

    <button 
      type="submit" 
      [disabled]="isLoading || !token" 
      style="width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;">
      {{ isLoading ? 'Updating...' : 'Update Password' }}
    </button>
  </form>
</div>
